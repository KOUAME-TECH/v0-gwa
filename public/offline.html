<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1F5C2E" />
    <title>Hors ligne — GWA</title>
    <style>
      :root {
        color-scheme: light;
        --cream: #fff6e5;
        --green: #1f5c2e;
        --gold: #c27d10;
        --ink: #111827;
        --muted: #4b5563;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(31, 92, 46, 0.12), transparent 55%),
          radial-gradient(900px 500px at 100% 0%, rgba(194, 125, 16, 0.14), transparent 50%),
          var(--cream);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .card {
        width: min(100%, 28rem);
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(17, 24, 39, 0.06);
        border-radius: 1.25rem;
        padding: 1.75rem 1.5rem;
        box-shadow: 0 18px 40px rgba(31, 92, 46, 0.08);
        text-align: center;
      }
      .mark {
        width: 3.25rem;
        height: 3.25rem;
        margin: 0 auto 1rem;
        border-radius: 1rem;
        background: linear-gradient(145deg, var(--green), #2f7d32);
        color: white;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 1.25rem;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
        line-height: 1.25;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }
      a, button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.8rem 1rem;
        font-weight: 650;
        font-size: 0.95rem;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        background: var(--green);
        color: white;
      }
      a.secondary {
        background: rgba(31, 92, 46, 0.08);
        color: var(--green);
      }
      .hint {
        margin-top: 1rem;
        font-size: 0.8rem;
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">G</div>
      <h1>Tu es hors ligne</h1>
      <p>
        Pas d’internet pour le moment. Tu peux rouvrir les pages déjà visitées
        (accueil, boutique) et reprendre un brouillon sur Publier.
      </p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Réessayer</button>
        <a class="secondary" href="/">Accueil</a>
        <a class="secondary" href="/marketplace">Boutique (cache)</a>
        <a class="secondary" href="/publier">Publier / brouillon</a>
      </div>
      <p class="hint">GWA · mode hors ligne</p>
    </main>
  </body>
</html>
